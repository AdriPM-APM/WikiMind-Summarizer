<script>
  /**
   * WIKIMIND ENGINE (ANTI-BRICK & SANDBOX BUILD)
   * Solves: DOM Wiping (document.write), Strict-Mode LocalStorage crashes, NetworkError halts.
   */
  const CONFIG = {
    proxyEndpoint: '/api/proxy',
    adKey: '1a3077682e07f93cc463da97dcfbb39e'
  };

  let debounceTimer;

  // --- 1. Privacy-Safe LocalStorage Handler ---
  const StorageManager = {
    get: (key) => {
      try { return localStorage.getItem(key); } catch(e) { return null; }
    },
    set: (key, value) => {
      try { localStorage.setItem(key, value); } catch(e) { console.warn('Almacenamiento local bloqueado por el navegador.'); }
    }
  };

  // --- 2. Anti-AdBlock Guard ---
  (function () {
    'use strict';
    const GuardConfig = Object.freeze({
      checkInterval: 3500,
      baitClasses: ['adsbygoogle', 'ad-banner', 'ad-unit', 'adbox'],
      randomPrefix: () => 'a' + Math.random().toString(36).substring(2, 9)
    });

    class AdBlockGuardEngine {
      constructor() { this.state = { blocked: false, hostElement: null }; }

      init() {
        window.addEventListener('load', () => {
          this.runChecks();
          setInterval(() => !this.state.blocked && this.runChecks(), GuardConfig.checkInterval);
        });
      }

      runChecks() {
        if (this.detectScriptletPill() || this.detectDomBait()) this.triggerEnforcement();
      }

      detectScriptletPill() {
        if (window.adsbygoogle) {
          const isArray = Array.isArray(window.adsbygoogle);
          const hasPushed = typeof window.adsbygoogle.push === 'function';
          if (window.adsbygoogle.loaded === false || (isArray && !hasPushed)) return true;
        }
        return false;
      }

      detectDomBait() {
        const bait = document.createElement('div');
        bait.className = GuardConfig.baitClasses.join(' ');
        bait.style.cssText = 'position:absolute!important;left:-9999px!important;top:-9999px!important;height:1px!important;width:1px!important;pointer-events:none!important;';
        document.body.appendChild(bait);
        const isHidden = bait.offsetHeight === 0 || window.getComputedStyle(bait).display === 'none';
        document.body.removeChild(bait);
        return isHidden;
      }

      triggerEnforcement() {
        if (this.state.blocked || StorageManager.get('hideAds') === 'true') return;
        this.state.blocked = true;
        
        this.state.hostElement = document.createElement(GuardConfig.randomPrefix());
        Object.assign(this.state.hostElement.style, {
          position: 'fixed', top: '0', left: '0', width: '100vw', height: '100vh', zIndex: '2147483647', display: 'block'
        });

        const shadow = this.state.hostElement.attachShadow({ mode: 'closed' });
        shadow.innerHTML = `
          <style>
            :host { all: initial; }
            .backdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; z-index: 2147483647; }
            .card { background: #fff; max-width: 400px; padding: 32px; border-radius: 12px; text-align: center; }
            .btn { background: #dc2626; color: #fff; border: none; padding: 12px 24px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 15px;}
          </style>
          <div class="backdrop">
            <div class="card">
              <h2 style="color:#000; margin-bottom: 10px;">Bloqueador Detectado</h2>
              <p style="color:#333;">Desactiva tu bloqueador de anuncios para continuar usando WikiMind.</p>
              <button class="btn" id="reload-btn">Recargar página</button>
            </div>
          </div>
        `;
        shadow.getElementById('reload-btn').addEventListener('click', () => window.location.reload());
        document.documentElement.appendChild(this.state.hostElement);
      }
    }
    new AdBlockGuardEngine().init();
  })();

  // --- 3. Sandboxed Ad Injection (Fixes Blank Page Bug) ---
  function initAds() {
    const hideAds = StorageManager.get('hideAds') === 'true';
    const hideCheckbox = document.getElementById('hide-ads-checkbox');
    hideCheckbox.checked = hideAds;
    
    if (!hideAds) {
      const adWrapper = document.getElementById('ad-wrapper');
      adWrapper.style.display = 'block';
      
      // CREATE SANDBOX IFRAME
      const iframe = document.createElement('iframe');
      iframe.style.width = '320px';
      iframe.style.height = '50px';
      iframe.style.border = 'none';
      iframe.style.overflow = 'hidden';
      iframe.setAttribute('scrolling', 'no');
      adWrapper.appendChild(iframe);

      // INJECT DOCUMENT.WRITE SAFELY INTO SANDBOX
      const adDoc = iframe.contentWindow.document;
      adDoc.open();
      adDoc.write(`
        <!DOCTYPE html><html><body style="margin:0;padding:0;text-align:center;">
        <script>
          window.atOptions = { 'key': '${CONFIG.adKey}', 'format': 'iframe', 'height': 50, 'width': 320, 'params': {} };
        \x3C/script>
        <script src="https://regaincocoa.com/${CONFIG.adKey}/invoke.js">\x3C/script>
        </body></html>
      `);
      adDoc.close();

      // Social Bar inject (Usually safe outside iframe, but keep track)
      const scriptNode = document.createElement('script');
      scriptNode.src = "https://regaincocoa.com/2c/92/9f/2c929f3d16a456f2de93856f778330a7.js";
      scriptNode.async = true;
      document.body.appendChild(scriptNode);
    }

    hideCheckbox.addEventListener('change', (e) => {
      StorageManager.set('hideAds', e.target.checked);
      location.reload();
    });
  }

  document.addEventListener("DOMContentLoaded", initAds);
  if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) document.body.classList.add('dark-mode');

  // --- 4. Utilities & Parsers ---
  function escapeHTML(str) { return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag])); }
  function parseMarkdown(text) {
    return escapeHTML(text).replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/__(.*?)__/g, '<u>$1</u>').replace(/\*(.*?)\*/g, '<i>$1</i>').replace(/\n/g, '<br>');
  }
  function showLoading() { document.getElementById('ai-output').className = 'visible'; document.getElementById('ai-output').innerHTML = `<div class="loading">Procesando artículo...</div>`; }
  function showError(msg) { document.getElementById('ai-output').className = 'visible'; document.getElementById('ai-output').innerHTML = `<div class="error-msg">Error: ${msg}</div>`; }
  function showResult(html) { document.getElementById('ai-output').className = 'visible'; document.getElementById('ai-output').innerHTML = html; }
  window.toggleTheme = () => document.body.classList.toggle('dark-mode');

  // --- 5. Robust Search & API Pipeline ---
  const searchInput = document.getElementById('search-input');
  const suggestionsBox = document.getElementById('suggestions-box');

  searchInput.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    const query = searchInput.value.trim();
    const sourceLang = document.getElementById('source-lang-select').value;
    if (query.length < 2) { suggestionsBox.classList.remove('visible'); return; }

    debounceTimer = setTimeout(async () => {
      try {
        const url = `https://${sourceLang}.wikipedia.org/w/api.php?action=opensearch&search=${encodeURIComponent(query)}&limit=6&namespace=0&format=json&origin=*`;
        const res = await fetch(url);
        if (!res.ok) return;
        const data = await res.json();
        
        if (!data[1] || data[1].length === 0) { suggestionsBox.classList.remove('visible'); return; }

        suggestionsBox.innerHTML = '';
        data[1].forEach((title, i) => {
          const li = document.createElement('li');
          li.className = 'suggestion-item';
          li.innerHTML = `<span class="suggestion-title">${escapeHTML(title)}</span><span class="suggestion-desc">${escapeHTML(data[2][i] || '')}</span>`;
          li.addEventListener('click', () => { searchInput.value = title; suggestionsBox.classList.remove('visible'); executeSearch(); });
          suggestionsBox.appendChild(li);
        });
        suggestionsBox.classList.add('visible');
      } catch (err) { console.error('Suggestion Fetch Error:', err); }
    }, 250);
  });

  document.addEventListener('click', (e) => {
    if (!searchInput.contains(e.target) && !suggestionsBox.contains(e.target)) suggestionsBox.classList.remove('visible');
  });

  window.executeSearch = async function() {
    suggestionsBox.classList.remove('visible');
    const query = searchInput.value.trim();
    if (!query) return;

    const sourceLang = document.getElementById('source-lang-select').value;
    const targetLang = document.getElementById('output-lang-select').value;
    const isNonAiMode = document.getElementById('non-ai-checkbox').checked;

    showLoading();

    try {
      const wikiUrl = `https://${sourceLang}.wikipedia.org/w/api.php?action=query&prop=extracts&explaintext=1&titles=${encodeURIComponent(query)}&origin=*&format=json`;
      const wikiRes = await fetch(wikiUrl);
      if (!wikiRes.ok) throw new Error(`Wikipedia bloqueada por red o CORS (${wikiRes.status})`);
      
      const wikiData = await wikiRes.json();
      const page = Object.values(wikiData.query.pages)[0];

      if (!page || page.missing) throw new Error(`No se encontró el artículo "${query}".`);
      if (!page.extract) throw new Error('El artículo está vacío.');

      const extract = page.extract.slice(0, 4000);

      const renderFallback = () => {
        const paragraphs = extract.split('\n').map(p => escapeHTML(p.trim())).filter(p => p.length > 0).slice(0, 3);
        showResult(`<div class="fallback-notice">Plan B: Extracción Clásica (Wiki Directa)</div>${paragraphs.map(p => `<p>${p}</p>`).join('')}`);
      };

      if (isNonAiMode) { renderFallback(); return; }

      try {
        const aiRes = await fetch(CONFIG.proxyEndpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'google/gemma-4-26b-a4b-it:free',
            messages: [
              { role: 'system', content: `Resume artículos en ${targetLang}. Usa **negrita** para conceptos y __subrayado__ para advertencias. Máximo 3 párrafos.` },
              { role: 'user', content: `Resume:\n\n${extract}` }
            ],
            temperature: 0.7,
            max_tokens: 600
          })
        });

        if (!aiRes.ok) throw new Error(`Proxy AI HTTP ${aiRes.status}`);
        const aiData = await aiRes.json();
        const raw = aiData.choices?.[0]?.message?.content || aiData.output || aiData.response;
        if (!raw) throw new Error('Respuesta AI vacía');
        showResult(parseMarkdown(raw));

      } catch (proxyErr) {
        console.warn('AI Network Error, activando failover:', proxyErr);
        renderFallback();
      }

    } catch (err) {
      // Handles LibreWolf/Strict CORS blocking Wikipedia directly
      showError(err.message + ". Si usas bloqueadores estrictos, desactiva la protección de rastreo cruzado (CORS).");
    }
  };

  searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') executeSearch(); });
</script>
