<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WikiMind · Enciclopedia resumida</title>
  <style>
    /* ===== Variables ===== */
    :root {
      --bg: #ffffff;
      --text: #202122;
      --text-secondary: #54595d;
      --border: #a2a9b1;
      --accent: #3366cc;
      --accent-hover: #2a4b8d;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Lato, Helvetica, Arial, sans-serif;
      --font-serif: 'Linux Libertine', Georgia, Times, serif;
    }

    body.dark-mode {
      --bg: #101418;
      --text: #eaecf0;
      --text-secondary: #c8ccd1;
      --border: #72777d;
      --accent: #6996e3;
    }

    /* ===== Reset ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 20px;
    }

    .app {
      max-width: 720px;
      width: 100%;
      text-align: center;
    }

    /* ===== Header ===== */
    .header {
      position: relative;
      margin-bottom: 20px;
    }

    .logo {
      font-family: var(--font-serif);
      font-size: 3rem;
      font-weight: normal;
      color: var(--text);
      letter-spacing: -0.5px;
    }

    .tagline {
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin-top: -4px;
      margin-bottom: 15px;
    }

    .theme-toggle {
      position: absolute;
      top: 0;
      right: 0;
      background: none;
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
      color: var(--text-secondary);
    }

    /* ===== Controls ===== */
    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px 30px;
      margin-bottom: 15px;
      font-size: 0.85rem;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .control-group label {
      color: var(--text-secondary);
    }

    .control-group select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 3px 6px;
      font-size: 0.85rem;
      border-radius: 2px;
      cursor: pointer;
    }

    /* ===== Settings ===== */
    .settings {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px 30px;
      margin-bottom: 20px;
      font-size: 0.85rem;
    }

    .settings label {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--text-secondary);
      cursor: pointer;
    }

    /* ===== Search ===== */
    .search-container {
      display: flex;
      position: relative;
      max-width: 600px;
      margin: 0 auto 20px;
    }

    .search-input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-right: none;
      border-radius: 2px 0 0 2px;
      font-size: 1rem;
      background: var(--bg);
      color: var(--text);
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .search-btn {
      background: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 0 2px 2px 0;
      padding: 0 22px;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .search-btn:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    /* ===== Suggestions ===== */
    .suggestions-list {
      position: absolute;
      top: 100%;
      left: 0;
      right: 54px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-top: none;
      z-index: 10;
      list-style: none;
      text-align: left;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      display: none;
    }

    .suggestions-list.visible {
      display: block;
    }

    .suggestion-item {
      padding: 8px 14px;
      cursor: pointer;
      font-size: 0.9rem;
      border-bottom: 1px solid #eaecf0;
      transition: background 0.1s;
    }

    body.dark-mode .suggestion-item {
      border-bottom: 1px solid #2a2a2a;
    }

    .suggestion-item:last-child {
      border-bottom: none;
    }

    .suggestion-item:hover {
      background: #f8f9fa;
    }

    body.dark-mode .suggestion-item:hover {
      background: #2a2a2a;
    }

    .suggestion-title {
      font-weight: 600;
      color: var(--text);
    }

    .suggestion-desc {
      font-size: 0.8rem;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ===== Ad Container ===== */
    #ad-wrapper {
      margin: 15px auto 20px;
      text-align: center;
      min-height: 60px;
      display: none; /* oculto por defecto */
    }

    #ad-wrapper.active {
      display: block;
    }

    #ad-wrapper > div {
      display: inline-block;
      background: var(--bg);
      border-radius: 6px;
      padding: 6px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }

    /* ===== Output ===== */
    #output {
      text-align: left;
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 24px;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-top: 10px;
      display: none;
    }

    #output.visible {
      display: block;
    }

    #output p {
      margin-bottom: 0.8rem;
    }

    #output b {
      font-weight: 700;
    }

    #output u {
      text-decoration: underline;
    }

    #output i {
      font-style: italic;
    }

    .loading {
      color: var(--text-secondary);
      font-style: italic;
    }

    .error-msg {
      color: #d33;
      font-weight: 600;
    }

    .fallback-badge {
      display: inline-block;
      margin-bottom: 12px;
      padding: 3px 10px;
      background: #eee;
      color: #333;
      font-size: 0.75rem;
      border-radius: 12px;
      font-weight: 600;
    }

    body.dark-mode .fallback-badge {
      background: #2a2a2a;
      color: #ccc;
    }

    .source-note {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-top: 10px;
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }
  </style>
</head>
<body>
<div class="app">
  <header class="header">
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Cambiar tema">🌓</button>
    <div class="logo">WikiMind</div>
    <div class="tagline">La enciclopedia resumida</div>
  </header>

  <!-- Controles de idioma -->
  <div class="controls">
    <div class="control-group">
      <label for="source-lang">De:</label>
      <select id="source-lang">
        <option value="en">EN</option>
        <option value="es" selected>ES</option>
        <option value="ca">CA</option>
        <option value="fr">FR</option>
        <option value="de">DE</option>
      </select>
    </div>
    <div class="control-group">
      <label for="target-lang">A (IA):</label>
      <select id="target-lang">
        <option value="en">EN</option>
        <option value="es" selected>ES</option>
        <option value="fr">FR</option>
        <option value="de">DE</option>
      </select>
    </div>
  </div>

  <!-- Ajustes -->
  <div class="settings">
    <label>
      <input type="checkbox" id="hide-ads" checked />
      Ocultar anuncios
    </label>
    <label>
      <input type="checkbox" id="non-ai-mode" checked />
      Modo sin IA (extracto directo)
    </label>
  </div>

  <!-- Búsqueda -->
  <div class="search-container">
    <input type="text" id="search-input" class="search-input" placeholder="Buscar en Wikipedia…" autocomplete="off" />
    <button class="search-btn" onclick="executeSearch()">🔍</button>
    <ul id="suggestions" class="suggestions-list"></ul>
  </div>

  <!-- Contenedor de anuncios (banner nativo) -->
  <div id="ad-wrapper">
    <!-- Aquí se inyectará el div del banner cuando los anuncios estén activos -->
  </div>

  <!-- Resultado -->
  <div id="output"></div>
</div>

<script>
  // ============================================================
  //  HELPERS
  // ============================================================
  function escapeHTML(str) {
    return str.replace(/[&<>'"]/g, tag => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;',
      "'": '&#39;', '"': '&quot;'
    }[tag] || tag));
  }

  function parseMarkdown(text) {
    return escapeHTML(text)
      .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
      .replace(/__(.*?)__/g, '<u>$1</u>')
      .replace(/\*(.*?)\*/g, '<i>$1</i>')
      .replace(/\n/g, '<br>');
  }

  // ============================================================
  //  LOCAL STORAGE (preferencias)
  // ============================================================
  const StorageManager = {
    get(key) {
      try { return localStorage.getItem(key); } catch (_) { return null; }
    },
    set(key, value) {
      try { localStorage.setItem(key, value); } catch (_) {}
    }
  };

  // ============================================================
  //  ANUNCIOS
  // ============================================================
  function loadAds() {
    const hideAds = StorageManager.get('hideAds') !== 'true'; // por defecto true (ocultos)
    const checkbox = document.getElementById('hide-ads');
    checkbox.checked = hideAds;

    const adWrapper = document.getElementById('ad-wrapper');

    function activateAds() {
      // Mostrar el contenedor
      adWrapper.classList.add('active');

      // 1. Crear el div para el banner nativo
      const bannerDiv = document.createElement('div');
      bannerDiv.id = 'container-1a3077682e07f93cc463da97dcfbb39e';
      adWrapper.appendChild(bannerDiv);

      // 2. Cargar el script del banner (invoke.js)
      const bannerScript = document.createElement('script');
      bannerScript.async = true;
      bannerScript.dataset.cfasync = 'false';
      bannerScript.src = 'https://regaincocoa.com/1a3077682e07f93cc463da97dcfbb39e/invoke.js';
      adWrapper.appendChild(bannerScript);

      // 3. Cargar el popunder (se ejecuta solo al añadirlo)
      const popunderScript = document.createElement('script');
      popunderScript.src = 'https://regaincocoa.com/6d/2c/f7/6d2cf7db6ec8913764d6fc5b151dca28.js';
      popunderScript.async = true;
      document.body.appendChild(popunderScript);
    }

    // Si el usuario NO quiere ocultar anuncios → mostrarlos
    if (!hideAds) {
      activateAds();
    }

    // Manejar cambio en el checkbox
    checkbox.addEventListener('change', function () {
      const newState = this.checked; // true = ocultar, false = mostrar
      StorageManager.set('hideAds', String(newState));
      // Recargar para aplicar cambios (los scripts se añaden o no)
      location.reload();
    });
  }

  // ============================================================
  //  UI STATE
  // ============================================================
  const outputEl = document.getElementById('output');
  const searchInput = document.getElementById('search-input');
  const suggestionsEl = document.getElementById('suggestions');

  function showLoading() {
    outputEl.className = 'visible';
    outputEl.innerHTML = `<div class="loading">⏳ Procesando…</div>`;
  }

  function showError(msg) {
    outputEl.className = 'visible';
    outputEl.innerHTML = `<div class="error-msg">❌ ${escapeHTML(msg)}</div>`;
  }

  function showResult(html) {
    outputEl.className = 'visible';
    outputEl.innerHTML = html;
  }

  // ============================================================
  //  TEMA OSCURO
  // ============================================================
  window.toggleTheme = () => document.body.classList.toggle('dark-mode');

  if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
    document.body.classList.add('dark-mode');
  }

  // ============================================================
  //  AUTOCOMPLETADO (OpenSearch)
  // ============================================================
  let debounceTimer;

  searchInput.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    const query = searchInput.value.trim();
    const lang = document.getElementById('source-lang').value;

    if (query.length < 2) {
      suggestionsEl.classList.remove('visible');
      return;
    }

    debounceTimer = setTimeout(async () => {
      try {
        const url = `https://${lang}.wikipedia.org/w/api.php?action=opensearch&search=${encodeURIComponent(query)}&limit=6&namespace=0&format=json&origin=*`;
        const res = await fetch(url);
        if (!res.ok) return;
        const data = await res.json();
        const titles = data[1] || [];
        const descs = data[2] || [];

        if (titles.length === 0) {
          suggestionsEl.classList.remove('visible');
          return;
        }

        suggestionsEl.innerHTML = '';
        titles.forEach((title, i) => {
          const li = document.createElement('li');
          li.className = 'suggestion-item';
          li.innerHTML = `
            <span class="suggestion-title">${escapeHTML(title)}</span>
            <span class="suggestion-desc">${escapeHTML(descs[i] || 'Artículo')}</span>
          `;
          li.addEventListener('click', () => {
            searchInput.value = title;
            suggestionsEl.classList.remove('visible');
            executeSearch();
          });
          suggestionsEl.appendChild(li);
        });
        suggestionsEl.classList.add('visible');
      } catch (_) {
        suggestionsEl.classList.remove('visible');
      }
    }, 250);
  });

  document.addEventListener('click', (e) => {
    if (!searchInput.contains(e.target) && !suggestionsEl.contains(e.target)) {
      suggestionsEl.classList.remove('visible');
    }
  });

  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') executeSearch();
  });

  // ============================================================
  //  BÚSQUEDA PRINCIPAL
  // ============================================================
  window.executeSearch = async function() {
    suggestionsEl.classList.remove('visible');

    const query = searchInput.value.trim();
    if (!query) return;

    const sourceLang = document.getElementById('source-lang').value;
    const targetLang = document.getElementById('target-lang').value;
    const nonAI = document.getElementById('non-ai-mode').checked;

    showLoading();

    try {
      // 1. Obtener extracto de Wikipedia
      const wikiUrl = `https://${sourceLang}.wikipedia.org/w/api.php?action=query&prop=extracts&explaintext=1&titles=${encodeURIComponent(query)}&origin=*&format=json`;
      const wikiRes = await fetch(wikiUrl);
      if (!wikiRes.ok) throw new Error('No se pudo conectar con Wikipedia.');
      const wikiData = await wikiRes.json();
      const page = Object.values(wikiData.query.pages)[0];

      if (!page || page.missing) {
        throw new Error(`No se encontró el artículo "${query}" en Wikipedia (${sourceLang}).`);
      }
      if (!page.extract) {
        throw new Error('El artículo está vacío o no tiene contenido textual.');
      }

      const extract = page.extract.slice(0, 5000);

      // 2. Modo sin IA → mostrar extracto directamente
      if (nonAI) {
        const paragraphs = extract.split('\n')
          .map(p => p.trim())
          .filter(p => p.length > 0)
          .slice(0, 8)
          .map(p => `<p>${escapeHTML(p)}</p>`)
          .join('');

        showResult(`
          <div class="fallback-badge">📄 Modo sin IA · Extracto de Wikipedia</div>
          ${paragraphs}
          <div class="source-note">Fuente: ${sourceLang}.wikipedia.org · ${escapeHTML(page.title)}</div>
        `);
        return;
      }

      // 3. Modo IA → resumir con Pollinations (gratuito, sin clave)
      const prompt = `
        Eres un asistente que resume artículos de Wikipedia.
        Responde SIEMPRE en el idioma: ${targetLang}.
        Usa **negrita** para conceptos clave.
        Máximo 3 párrafos.
        Artículo (en ${sourceLang}):
        ${extract}
        Resumen en ${targetLang}:
      `.trim();

      const aiUrl = `https://text.pollinations.ai/prompt?prompt=${encodeURIComponent(prompt)}`;
      const aiRes = await fetch(aiUrl);
      if (!aiRes.ok) throw new Error('Error al consultar el servicio de IA (Pollinations).');
      const aiText = await aiRes.text();

      if (!aiText || aiText.length < 10) throw new Error('La IA devolvió una respuesta vacía o muy corta.');

      showResult(parseMarkdown(aiText));

    } catch (err) {
      console.error(err);
      showError(err.message + ' · Comprueba tu conexión o intenta con el modo sin IA.');
    }
  };

  // ============================================================
  //  INICIALIZACIÓN
  // ============================================================
  document.addEventListener('DOMContentLoaded', () => {
    // Cargar estado de los anuncios (y activarlos si corresponde)
    loadAds();
  });
</script>
</body>
      </html>
