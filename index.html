<script>
  /**
   * WIKIMIND CORE - OMNI-ARCHITECT OPTIMIZED BUILD
   * Features: Auto-Failover, Hardened Ad Injection, Race-Condition-Free Anti-AdBlock
   */
  
  const CONFIG = {
    proxyEndpoint: '/api/proxy', // Adjust this to your actual backend URL if different
    adKey: '1a3077682e07f93cc463da97dcfbb39e'
  };

  let debounceTimer;

  // --- 1. Hardened Anti-AdBlock Engine ---
  (function () {
    'use strict';
    const GuardConfig = Object.freeze({
      checkInterval: 3000,
      baitClasses: ['adsbygoogle', 'ad-banner', 'ad-unit', 'sponsored-ad', 'adbox'],
      randomPrefix: () => 'a' + Math.random().toString(36).substring(2, 9)
    });

    class AdBlockGuardEngine {
      constructor() {
        this.state = { blocked: false, hostElement: null, observer: null };
      }

      init() {
        // Delay execution until full load to prevent false positives
        window.addEventListener('load', () => {
          this.runChecks();
          this.startPassiveMonitoring();
        });
      }

      runChecks() {
        if (this.detectScriptletPill() || this.detectDomBait()) {
          this.triggerEnforcement();
        }
      }

      detectScriptletPill() {
        if (window.adsbygoogle) {
          const isArray = Array.isArray(window.adsbygoogle);
          const hasPushed = typeof window.adsbygoogle.push === 'function';
          if (window.adsbygoogle.loaded === false || (isArray && !hasPushed)) return true;
        }
        return false;
      }

      detectDomBait() {
        const bait = document.createElement('div');
        bait.className = GuardConfig.baitClasses.join(' ');
        bait.style.cssText = 'position:absolute!important;left:-9999px!important;top:-9999px!important;height:1px!important;width:1px!important;pointer-events:none!important;';
        document.body.appendChild(bait);
        const computed = window.getComputedStyle(bait);
        const isHidden = bait.offsetHeight === 0 || computed.display === 'none' || computed.visibility === 'hidden';
        document.body.removeChild(bait);
        return isHidden;
      }

      triggerEnforcement() {
        if (this.state.blocked || localStorage.getItem('hideAds') === 'true') return;
        this.state.blocked = true;
        this.mountEnforcementOverlay();
      }

      mountEnforcementOverlay() {
        if (this.state.hostElement && this.state.hostElement.isConnected) this.state.hostElement.remove();
        
        this.state.hostElement = document.createElement(GuardConfig.randomPrefix());
        Object.assign(this.state.hostElement.style, {
          position: 'fixed', top: '0', left: '0', width: '100vw', height: '100vh',
          zIndex: '2147483647', display: 'block'
        });

        const shadow = this.state.hostElement.attachShadow({ mode: 'closed' });
        shadow.innerHTML = `
          <style>
            :host { all: initial; }
            .backdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; font-family: sans-serif; z-index: 2147483647; }
            .card { background: #fff; max-width: 400px; padding: 32px; border-radius: 12px; text-align: center; }
            .btn { background: #dc2626; color: #fff; border: none; padding: 12px 24px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 15px;}
          </style>
          <div class="backdrop">
            <div class="card">
              <h2 style="color:#000;">AdBlock Detectado</h2>
              <p style="color:#333;">Por favor, desactiva tu bloqueador para usar la IA gratis.</p>
              <button class="btn" id="reload-btn">Recargar página</button>
            </div>
          </div>
        `;

        shadow.getElementById('reload-btn').addEventListener('click', () => window.location.reload());
        document.documentElement.appendChild(this.state.hostElement);
      }

      startPassiveMonitoring() {
        setInterval(() => !this.state.blocked && this.runChecks(), GuardConfig.checkInterval);
      }
    }

    new AdBlockGuardEngine().init();
  })();

  // --- 2. Ad Engine Configuration (Fixed Injection) ---
  function injectScript(src) {
    const s = document.createElement('script');
    s.src = src;
    s.async = true;
    document.body.appendChild(s);
  }

  function initAds() {
    const hideAds = localStorage.getItem('hideAds') === 'true';
    const hideCheckbox = document.getElementById('hide-ads-checkbox');
    hideCheckbox.checked = hideAds;
    
    if (!hideAds) {
      const adWrapper = document.getElementById('ad-wrapper');
      adWrapper.style.display = 'block';
      
      // Inject required atOptions for regaincocoa invoke.js
      window.atOptions = {
        'key' : CONFIG.adKey,
        'format' : 'iframe',
        'height' : 50,
        'width' : 320,
        'params' : {}
      };

      const nativeContainer = document.createElement('div');
      nativeContainer.id = `container-${CONFIG.adKey}`;
      adWrapper.appendChild(nativeContainer);
      
      const nativeScript = document.createElement('script');
      nativeScript.async = true;
      nativeScript.dataset.cfasync = "false";
      nativeScript.src = `https://regaincocoa.com/${CONFIG.adKey}/invoke.js`;
      adWrapper.appendChild(nativeScript);

      // Social Bar & Popunder
      injectScript("https://regaincocoa.com/2c/92/9f/2c929f3d16a456f2de93856f778330a7.js");
      injectScript("https://regaincocoa.com/6d/2c/f7/6d2cf7db6ec8913764d6fc5b151dca28.js");
    }

    hideCheckbox.addEventListener('change', (e) => {
      localStorage.setItem('hideAds', e.target.checked);
      location.reload();
    });
  }

  document.addEventListener("DOMContentLoaded", initAds);
  
  if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
    document.body.classList.add('dark-mode');
  }

  // --- 3. UI Logic & Parsers ---
  function escapeHTML(str) {
    return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag]));
  }

  function parseMarkdown(text) {
    const cleanText = escapeHTML(text);
    return cleanText
      .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
      .replace(/__(.*?)__/g, '<u>$1</u>')
      .replace(/\*(.*?)\*/g, '<i>$1</i>')
      .replace(/\n/g, '<br>');
  }

  function showLoading() {
    const out = document.getElementById('ai-output');
    out.className = 'visible';
    out.innerHTML = `<div class="loading">Procesando artículo...</div>`;
  }

  function showError(msg) {
    const out = document.getElementById('ai-output');
    out.className = 'visible';
    out.innerHTML = `<div class="error-msg">Error: ${msg}</div>`;
  }

  function showResult(html) {
    const out = document.getElementById('ai-output');
    out.className = 'visible';
    out.innerHTML = html;
  }

  window.toggleTheme = function() {
    document.body.classList.toggle('dark-mode');
  };

  // --- 4. Search & Fallback Logic ---
  const searchInput = document.getElementById('search-input');
  const suggestionsBox = document.getElementById('suggestions-box');

  searchInput.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    const query = searchInput.value.trim();
    const sourceLang = document.getElementById('source-lang-select').value;

    if (query.length < 2) {
      suggestionsBox.classList.remove('visible');
      return;
    }

    debounceTimer = setTimeout(async () => {
      try {
        const url = `https://${sourceLang}.wikipedia.org/w/api.php?action=opensearch&search=${encodeURIComponent(query)}&limit=6&namespace=0&format=json&origin=*`;
        const res = await fetch(url);
        if (!res.ok) return;
        const data = await res.json();
        
        const titles = data[1] || [];
        const descriptions = data[2] || [];

        if (titles.length === 0) {
          suggestionsBox.classList.remove('visible');
          return;
        }

        suggestionsBox.innerHTML = '';
        titles.forEach((title, index) => {
          const li = document.createElement('li');
          li.className = 'suggestion-item';
          li.innerHTML = `<span class="suggestion-title">${escapeHTML(title)}</span><span class="suggestion-desc">${escapeHTML(descriptions[index] || 'Artículo de Wikipedia')}</span>`;
          li.addEventListener('click', () => {
            searchInput.value = title;
            suggestionsBox.classList.remove('visible');
            executeSearch();
          });
          suggestionsBox.appendChild(li);
        });
        suggestionsBox.classList.add('visible');
      } catch (err) {
        console.error('Error de sugerencias:', err);
      }
    }, 250);
  });

  document.addEventListener('click', (e) => {
    if (!searchInput.contains(e.target) && !suggestionsBox.contains(e.target)) {
      suggestionsBox.classList.remove('visible');
    }
  });

  window.executeSearch = async function() {
    suggestionsBox.classList.remove('visible');
    const query = searchInput.value.trim();
    const sourceLang = document.getElementById('source-lang-select').value;
    const targetLang = document.getElementById('output-lang-select').value;
    const isNonAiMode = document.getElementById('non-ai-checkbox').checked;

    if (!query) return;
    showLoading();

    try {
      const wikiUrl = `https://${sourceLang}.wikipedia.org/w/api.php?action=query&prop=extracts&explaintext=1&titles=${encodeURIComponent(query)}&origin=*&format=json`;
      const wikiRes = await fetch(wikiUrl);
      if (!wikiRes.ok) throw new Error('Wikipedia Inaccesible');
      
      const wikiData = await wikiRes.json();
      const page = Object.values(wikiData.query.pages)[0];

      if (!page || page.missing) throw new Error(`No se encontró "${query}".`);
      if (!page.extract) throw new Error('Artículo sin texto.');

      const extract = page.extract.slice(0, 4000);

      const renderFallback = () => {
        const paragraphs = extract.split('\n').map(p => escapeHTML(p.trim())).filter(p => p.length > 0).slice(0, 3);
        showResult(`<div class="fallback-notice">Plan B Activo: Extracción de Wikipedia Directa</div>${paragraphs.map(p => `<p>${p}</p>`).join('')}`);
      };

      if (isNonAiMode) {
        renderFallback();
        return;
      }

      // Proxy API Call (With Auto-Failover Plan B)
      try {
        const aiRes = await fetch(CONFIG.proxyEndpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'google/gemma-4-26b-a4b-it:free',
            messages: [
              { role: 'system', content: `Resume en ${targetLang}. Usa **negrita**, *cursiva*, __subrayado__. Max 3 párrafos.` },
              { role: 'user', content: `Resume:\n\n${extract}` }
            ],
            temperature: 0.7,
            max_tokens: 600
          })
        });

        if (!aiRes.ok) throw new Error(`HTTP ${aiRes.status}`);
        const aiData = await aiRes.json();
        const raw = aiData.choices?.[0]?.message?.content || aiData.output || aiData.response;
        
        if (!raw) throw new Error('Respuesta IA vacía');
        showResult(parseMarkdown(raw));

      } catch (proxyErr) {
        console.warn('Fallo en Proxy IA. Ejecutando Plan B.', proxyErr);
        renderFallback(); // QoL: Never leave the user on an error screen if we have the raw data.
      }

    } catch (err) {
      showError(err.message);
    }
  };

  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') executeSearch();
  });
          </script>
