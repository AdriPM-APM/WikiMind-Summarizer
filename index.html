<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WikiMind · Enciclopedia con IA</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #202122;
      --text-secondary: #54595d;
      --border: #a2a9b1;
      --accent: #3366cc;
      --accent-hover: #2a4b8d;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Lato, Helvetica, Arial, sans-serif;
      --font-serif: 'Linux Libertine', Georgia, Times, serif;
    }
    body.dark-mode {
      --bg: #101418;
      --text: #eaecf0;
      --text-secondary: #c8ccd1;
      --border: #72777d;
      --accent: #6996e3;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 30px 15px;
      min-height: 100vh;
    }
    .app {
      max-width: 720px;
      width: 100%;
      text-align: center;
    }
    .header { position: relative; margin-bottom:20px; }
    .logo { font-family:var(--font-serif); font-size:2.8rem; font-weight:normal; }
    .tagline { font-size:0.9rem; color:var(--text-secondary); margin-top:-4px; }
    .theme-toggle {
      position:absolute; top:0; right:0;
      background:none; border:none; font-size:1.3rem; cursor:pointer;
      color:var(--text-secondary);
    }
    .controls, .settings {
      display:flex; flex-wrap:wrap; justify-content:center;
      gap:15px 25px; margin-bottom:12px; font-size:0.85rem;
    }
    .control-group {
      display:flex; align-items:center; gap:6px;
    }
    .control-group label { color:var(--text-secondary); }
    .control-group select {
      background:var(--bg); border:1px solid var(--border); color:var(--text);
      padding:3px 6px; border-radius:2px; cursor:pointer;
    }
    .settings label {
      display:flex; align-items:center; gap:5px;
      color:var(--text-secondary); cursor:pointer;
    }
    .mode-selector {
      display:flex; flex-wrap:wrap; justify-content:center;
      gap:10px 20px; margin-bottom:15px; font-size:0.9rem;
    }
    .mode-selector label {
      display:flex; align-items:center; gap:5px; cursor:pointer;
      color:var(--text-secondary); padding:4px 12px;
      border-radius:20px; border:1px solid transparent; transition:0.2s;
    }
    .mode-selector input[type="radio"] { accent-color:var(--accent); }
    .mode-selector label:has(input:checked) {
      border-color:var(--accent); background:var(--accent); color:#fff;
    }
    body.dark-mode .mode-selector label:has(input:checked) {
      background:var(--accent); color:#fff;
    }
    .search-container {
      display:flex; position:relative; max-width:600px; margin:0 auto 20px;
    }
    .search-input {
      flex:1; padding:10px 14px;
      border:1px solid var(--border); border-right:none;
      border-radius:2px 0 0 2px;
      font-size:1rem; background:var(--bg); color:var(--text); outline:none;
    }
    .search-input:focus { border-color:var(--accent); }
    .search-btn {
      background:var(--accent); border:1px solid var(--accent);
      border-radius:0 2px 2px 0; padding:0 22px;
      color:#fff; font-size:1rem; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      transition:background 0.15s;
    }
    .search-btn:hover { background:var(--accent-hover); border-color:var(--accent-hover); }
    .suggestions-list {
      position:absolute; top:100%; left:0; right:54px;
      background:var(--bg); border:1px solid var(--border); border-top:none;
      z-index:10; list-style:none; text-align:left;
      box-shadow:0 2px 8px rgba(0,0,0,0.08); display:none;
    }
    .suggestions-list.visible { display:block; }
    .suggestion-item {
      padding:8px 14px; cursor:pointer; font-size:0.9rem;
      border-bottom:1px solid #eaecf0; transition:background 0.1s;
    }
    body.dark-mode .suggestion-item { border-bottom:1px solid #2a2a2a; }
    .suggestion-item:last-child { border-bottom:none; }
    .suggestion-item:hover { background:#f8f9fa; }
    body.dark-mode .suggestion-item:hover { background:#2a2a2a; }
    .suggestion-title { font-weight:600; color:var(--text); }
    .suggestion-desc { font-size:0.8rem; color:var(--text-secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #ad-wrapper { margin:10px auto 15px; text-align:center; min-height:50px; display:none; }
    #ad-wrapper.active { display:block; }
    #output {
      text-align:left; background:var(--bg); border:1px solid var(--border);
      padding:20px 22px; font-size:0.95rem; line-height:1.6;
      margin-top:10px; display:none;
    }
    #output.visible { display:block; }
    #output p { margin-bottom:0.8rem; }
    #output b { font-weight:700; }
    #output u { text-decoration:underline; }
    #output i { font-style:italic; }
    .loading { color:var(--text-secondary); font-style:italic; }
    .error-msg { color:#d33; font-weight:600; }
    .badge {
      display:inline-block; margin-bottom:10px; padding:2px 12px;
      background:#e8f0fe; color:#1a3b6a; font-size:0.75rem;
      border-radius:12px; font-weight:600;
    }
    body.dark-mode .badge { background:#2a3a5a; color:#c8d8f0; }
    .source-note {
      font-size:0.8rem; color:var(--text-secondary);
      margin-top:10px; border-top:1px solid var(--border); padding-top:10px;
    }
    .retry-btn {
      background:var(--accent); color:#fff; border:none;
      padding:4px 14px; border-radius:4px; cursor:pointer;
      font-size:0.8rem; margin-top:8px;
    }
    .retry-btn:hover { background:var(--accent-hover); }
    #debug {
      margin-top:15px; padding:10px; background:var(--bg);
      border:1px dashed var(--border); text-align:left;
      font-size:0.7rem; color:var(--text-secondary);
      white-space:pre-wrap; word-break:break-all; display:none;
      max-height:200px; overflow-y:auto;
    }
  </style>
</head>
<body>
<div class="app">
  <header class="header">
    <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
    <div class="logo">WikiMind</div>
    <div class="tagline">Enciclopedia con resumen inteligente</div>
  </header>

  <div class="controls">
    <div class="control-group">
      <label for="source-lang">Origen:</label>
      <select id="source-lang">
        <option value="en">EN</option><option value="es" selected>ES</option>
        <option value="ca">CA</option><option value="fr">FR</option><option value="de">DE</option>
      </select>
    </div>
    <div class="control-group">
      <label for="target-lang">Resumen:</label>
      <select id="target-lang">
        <option value="en">EN</option><option value="es" selected>ES</option>
        <option value="fr">FR</option><option value="de">DE</option>
      </select>
    </div>
  </div>

  <div class="mode-selector">
    <label><input type="radio" name="summary-mode" value="extract" checked /> 📄 Extracto</label>
    <label><input type="radio" name="summary-mode" value="local" /> 🧠 Local</label>
    <label><input type="radio" name="summary-mode" value="ai" /> 🤖 IA</label>
  </div>

  <div class="settings">
    <label><input type="checkbox" id="hide-ads" checked /> Ocultar anuncios</label>
  </div>

  <div class="search-container">
    <input type="text" id="search-input" class="search-input" placeholder="Buscar en Wikipedia…" autocomplete="off" />
    <button class="search-btn" id="search-btn">🔍</button>
    <ul id="suggestions" class="suggestions-list"></ul>
  </div>

  <div id="ad-wrapper"></div>
  <div id="output"></div>
  <div id="debug"></div>
</div>

<script>
  // ============================================================
  //  DEPURACIÓN
  // ============================================================
  const debugEl = document.getElementById('debug');
  function log(msg) {
    debugEl.style.display = 'block';
    debugEl.textContent += msg + '\n';
    console.log(msg);
  }

  // ============================================================
  //  HELPERS
  // ============================================================
  function escapeHTML(str) {
    if (!str) return '';
    return str.replace(/[&<>'"]/g, tag => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;',
      "'": '&#39;', '"': '&quot;'
    }[tag] || tag));
  }

  function parseMarkdown(text) {
    return escapeHTML(text)
      .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
      .replace(/__(.*?)__/g, '<u>$1</u>')
      .replace(/\*(.*?)\*/g, '<i>$1</i>')
      .replace(/\n/g, '<br>');
  }

  // ============================================================
  //  LOCAL STORAGE
  // ============================================================
  const Storage = {
    get(key) { try { return localStorage.getItem(key); } catch(_){return null;} },
    set(key,val) { try { localStorage.setItem(key,val); } catch(_){} }
  };

  // ============================================================
  //  ANUNCIOS
  // ============================================================
  function loadAds() {
    const hideAds = Storage.get('hideAds') !== 'false';
    const checkbox = document.getElementById('hide-ads');
    checkbox.checked = hideAds;
    const wrapper = document.getElementById('ad-wrapper');

    function activate() {
      wrapper.classList.add('active');
      // Banner nativo
      const div = document.createElement('div');
      div.id = 'container-1a3077682e07f93cc463da97dcfbb39e';
      wrapper.appendChild(div);
      const script1 = document.createElement('script');
      script1.async = true;
      script1.dataset.cfasync = 'false';
      script1.src = 'https://regaincocoa.com/1a3077682e07f93cc463da97dcfbb39e/invoke.js';
      wrapper.appendChild(script1);
      // Popunder
      const script2 = document.createElement('script');
      script2.src = 'https://regaincocoa.com/6d/2c/f7/6d2cf7db6ec8913764d6fc5b151dca28.js';
      script2.async = true;
      document.body.appendChild(script2);
      log('Anuncios activados');
    }

    if (!hideAds) activate();

    checkbox.addEventListener('change', function() {
      Storage.set('hideAds', String(this.checked));
      location.reload();
    });
  }

  // ============================================================
  //  UI STATE
  // ============================================================
  const outputEl = document.getElementById('output');
  const searchInput = document.getElementById('search-input');
  const suggestionsEl = document.getElementById('suggestions');
  const searchBtn = document.getElementById('search-btn');

  function showLoading() {
    outputEl.className = 'visible';
    outputEl.innerHTML = `<div class="loading">⏳ Procesando…</div>`;
  }

  function showError(msg, retryFn = null) {
    outputEl.className = 'visible';
    let html = `<div class="error-msg">❌ ${escapeHTML(msg)}</div>`;
    if (retryFn) html += `<button class="retry-btn" onclick="(${retryFn.toString()})()">Reintentar</button>`;
    outputEl.innerHTML = html;
  }

  function showResult(html) {
    outputEl.className = 'visible';
    outputEl.innerHTML = html;
  }

  // ============================================================
  //  TEMA OSCURO
  // ============================================================
  window.toggleTheme = () => document.body.classList.toggle('dark-mode');
  if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
    document.body.classList.add('dark-mode');
  }

  // ============================================================
  //  AUTOCOMPLETADO (OpenSearch)
  // ============================================================
  let debounceTimer;
  searchInput.addEventListener('input', function() {
    clearTimeout(debounceTimer);
    const query = this.value.trim();
    const lang = document.getElementById('source-lang').value;
    if (query.length < 2) {
      suggestionsEl.classList.remove('visible');
      return;
    }
    debounceTimer = setTimeout(async () => {
      try {
        const url = `https://${lang}.wikipedia.org/w/api.php?action=opensearch&search=${encodeURIComponent(query)}&limit=6&namespace=0&format=json&origin=*`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        const titles = data[1] || [];
        const descs = data[2] || [];
        if (titles.length === 0) {
          suggestionsEl.classList.remove('visible');
          return;
        }
        suggestionsEl.innerHTML = '';
        titles.forEach((title, i) => {
          const li = document.createElement('li');
          li.className = 'suggestion-item';
          li.innerHTML = `
            <span class="suggestion-title">${escapeHTML(title)}</span>
            <span class="suggestion-desc">${escapeHTML(descs[i] || 'Artículo')}</span>
          `;
          li.addEventListener('click', () => {
            searchInput.value = title;
            suggestionsEl.classList.remove('visible');
            executeSearch();
          });
          suggestionsEl.appendChild(li);
        });
        suggestionsEl.classList.add('visible');
        log(`Sugerencias: ${titles.length}`);
      } catch (err) {
        log('Error sugerencias: ' + err.message);
        suggestionsEl.classList.remove('visible');
      }
    }, 300);
  });

  document.addEventListener('click', (e) => {
    if (!searchInput.contains(e.target) && !suggestionsEl.contains(e.target)) {
      suggestionsEl.classList.remove('visible');
    }
  });

  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') executeSearch();
  });

  // ============================================================
  //  FUNCIONES DE RESUMEN
  // ============================================================
  function localSummarize(text, targetLang) {
    log('Generando resumen local');
    const paragraphs = text.split('\n').map(p => p.trim()).filter(p => p.length > 20);
    let summary = paragraphs.slice(0, 3).join('\n\n');
    if (summary.length > 2500) summary = summary.slice(0, 2500) + '…';
    const lines = summary.split('\n').map(line => {
      const words = line.split(' ');
      for (let i = 0; i < words.length; i++) {
        const w = words[i];
        if (w.length > 2 && /^[A-ZÁÉÍÓÚÑ]/.test(w) && !/^[A-ZÁÉÍÓÚÑ]{2,}$/.test(w)) {
          words[i] = `**${w}**`;
          break;
        }
      }
      return words.join(' ');
    });
    summary = lines.join('\n');
    return `<div class="badge">🧠 Resumen local (${targetLang.toUpperCase()})</div>${parseMarkdown(summary)}`;
  }

  async function aiSummarize(text, sourceLang, targetLang) {
    log('Solicitando resumen IA...');
    const prompt = `
      Resume el siguiente artículo de Wikipedia en ${targetLang.toUpperCase()}.
      Usa **negrita** para conceptos clave.
      Máximo 3 párrafos.
      Artículo (en ${sourceLang.toUpperCase()}):
      ${text.slice(0, 4000)}
      Resumen en ${targetLang.toUpperCase()}:
    `.trim();

    const url = `https://text.pollinations.ai/prompt?prompt=${encodeURIComponent(prompt)}`;
    const response = await fetch(url, { method: 'GET', headers: { 'Accept': 'text/plain' } });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const result = await response.text();
    if (!result || result.length < 10) throw new Error('Respuesta vacía o muy corta');
    log('IA respondió correctamente');
    return result;
  }

  // ============================================================
  //  BÚSQUEDA PRINCIPAL
  // ============================================================
  async function executeSearch() {
    suggestionsEl.classList.remove('visible');
    const query = searchInput.value.trim();
    if (!query) {
      log('Búsqueda vacía');
      return;
    }

    const sourceLang = document.getElementById('source-lang').value;
    const targetLang = document.getElementById('target-lang').value;
    const mode = document.querySelector('input[name="summary-mode"]:checked').value;

    log(`Buscar: "${query}" | Origen: ${sourceLang} | Modo: ${mode}`);
    showLoading();

    try {
      // Obtener extracto de Wikipedia
      const wikiUrl = `https://${sourceLang}.wikipedia.org/w/api.php?action=query&prop=extracts&explaintext=1&titles=${encodeURIComponent(query)}&origin=*&format=json`;
      log('Fetching Wikipedia...');
      const wikiRes = await fetch(wikiUrl);
      if (!wikiRes.ok) throw new Error('HTTP ' + wikiRes.status + ' al conectar con Wikipedia.');
      const wikiData = await wikiRes.json();
      const pages = wikiData.query.pages;
      const pageId = Object.keys(pages)[0];
      const page = pages[pageId];

      if (pageId === '-1' || page.missing) {
        throw new Error(`No se encontró el artículo "${query}" en Wikipedia (${sourceLang}).`);
      }
      if (!page.extract) {
        throw new Error('El artículo está vacío.');
      }

      const extract = page.extract;
      log(`Extracto obtenido: ${extract.length} caracteres`);

      let resultHtml = '';

      if (mode === 'extract') {
        const paragraphs = extract.split('\n')
          .map(p => p.trim())
          .filter(p => p.length > 0)
          .slice(0, 8)
          .map(p => `<p>${escapeHTML(p)}</p>`)
          .join('');
        resultHtml = `<div class="badge">📄 Extracto completo de Wikipedia</div>${paragraphs}`;
        log('Modo extracto');
      } else if (mode === 'local') {
        resultHtml = localSummarize(extract, targetLang);
      } else if (mode === 'ai') {
        try {
          const aiText = await aiSummarize(extract, sourceLang, targetLang);
          resultHtml = `<div class="badge">🤖 Resumen con IA (${targetLang.toUpperCase()})</div>${parseMarkdown(aiText)}`;
          log('Modo IA exitoso');
        } catch (aiErr) {
          log('Fallo IA: ' + aiErr.message + ' → usando local');
          const fallback = localSummarize(extract, targetLang);
          resultHtml = `
            <div class="badge" style="background:#f9e0d0;color:#7a3a1a;">⚠️ IA falló, mostrando resumen local</div>
            ${fallback}
          `;
        }
      } else {
        throw new Error('Modo desconocido');
      }

      resultHtml += `<div class="source-note">Fuente: ${sourceLang}.wikipedia.org · ${escapeHTML(page.title)}</div>`;
      showResult(resultHtml);

    } catch (err) {
      log('ERROR: ' + err.message);
      showError(err.message + ' · Intenta con otro modo.', executeSearch);
    }
  }

  window.executeSearch = executeSearch;

  // ============================================================
  //  INICIALIZACIÓN
  // ============================================================
  document.addEventListener('DOMContentLoaded', function() {
    log('DOM cargado, inicializando...');
    loadAds();
    document.querySelector('input[name="summary-mode"][value="extract"]').checked = true;
    log('Inicialización completa');
  });

  searchBtn.addEventListener('click', executeSearch);
</script>
</body>
</html>
